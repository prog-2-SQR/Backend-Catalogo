services:
  postgres:
    image: postgres:18-alpine
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-catalogo}
      POSTGRES_USER: ${DB_USERNAME:-catalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - catalogo-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalogo-db-data:
