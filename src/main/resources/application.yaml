spring:
  application:
    name: catalogo
  config:
    # Lee el archivo .env de la raíz del proyecto si existe (en local).
    # En otros entornos las mismas claves llegan como variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo}
    username: ${DB_USERNAME:catalogo}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Liquibase; Hibernate solo verifica que coincida con las entidades.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      # Redis de la cátedra (anexo §14), solo lectura. Datos de la cuenta técnica en .env.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  kafka:
    # Kafka de la cátedra (anexo §15): el catálogo solo consume. Datos de la integración en .env.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:catalogo}
      # La primera vez lee el topic desde el principio; después sigue desde el último offset confirmado.
      auto-offset-reset: earliest
    listener:
      # El offset de cada mensaje se confirma cuando el listener terminó de procesarlo (anexo §16).
      ack-mode: record
  mvc:
    problemdetails:
      # Los errores HTTP salen como application/problem+json (RFC 9457), como pide el anexo §13.
      enabled: true

catedra:
  # Servicio central de la cátedra (anexo §3). Los valores reales van en .env, nunca en el repositorio.
  # Sin valor por defecto: si faltan, la validación de CatedraProperties frena el arranque.
  api-url: ${CATEDRA_API_URL:}
  jwt: ${CATEDRA_JWT:}
  # Topic de avisos de versión nueva (anexo §15.2). Sin valor por defecto: si falta, la app no arranca.
  catalog-topic: ${KAFKA_CATALOG_TOPIC}

security:
  jwt:
    # El mismo secreto que el servicio de turnos (que emite los tokens): el catálogo solo los valida.
    # Sin valor por defecto: si falta, la app no arranca. Nunca se commitea.
    base64-secret: ${JWT_BASE64_SECRET:}

management:
  health:
    redis:
      # El indicador de Spring usa PING/INFO, que la ACL de la cátedra no permite: lo reemplaza CatalogRedisHealthIndicator.
      enabled: false
  endpoint:
    health:
      # Muestra el estado de cada componente (db, disco...) sin exponer detalles internos.
      show-components: always
