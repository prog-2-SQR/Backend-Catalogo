spring:
  application:
    name: catalogo
  config:
    # Lee el archivo .env de la raíz del proyecto si existe (en local).
    # En otros entornos las mismas claves llegan como variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo}
    username: ${DB_USERNAME:catalogo}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Liquibase; Hibernate solo verifica que coincida con las entidades.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      # Redis de la cátedra (anexo §14), solo lectura. Datos de la cuenta técnica en .env.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  mvc:
    problemdetails:
      # Los errores HTTP salen como application/problem+json (RFC 9457), como pide el anexo §13.
      enabled: true

catedra:
  # Servicio central de la cátedra (anexo §3). Los valores reales van en .env, nunca en el repositorio.
  # Sin valor por defecto: si faltan, la validación de CatedraProperties frena el arranque.
  api-url: ${CATEDRA_API_URL:}
  jwt: ${CATEDRA_JWT:}

management:
  health:
    redis:
      # El indicador de Spring usa PING/INFO, que la ACL de la cátedra no permite: lo reemplaza CatalogRedisHealthIndicator.
      enabled: false
  endpoint:
    health:
      # Muestra el estado de cada componente (db, disco...) sin exponer detalles internos.
      show-components: always
