# Changelog maestro de Liquibase. Cada slice agrega su propio archivo en esta
# carpeta y se incluye acá, en el orden en que deben aplicarse.

databaseChangeLog:
  - include:
      file: db/changelog/category.yaml
  - include:
      file: db/changelog/professional.yaml
  - include:
      file: db/changelog/schedule.yaml
  - include:
      file: db/changelog/sync.yaml
